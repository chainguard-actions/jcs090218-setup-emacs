name: Test snapshot Emacs installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-emacs
        uses: .
        with:
          version: "snapshot"
      - name: Assert emacs is installed
        run: |
          echo "Checking emacs binary..."
          if ! command -v emacs &>/dev/null; then
            echo "FAIL: emacs binary not found in PATH"
            exit 1
          fi
          echo "PASS: emacs is installed"
      - name: Assert emacs can run
        run: |
          EMACS_VERSION=$(emacs --version | head -1)
          echo "actual: $EMACS_VERSION"
          if ! echo "$EMACS_VERSION" | grep -qi "emacs"; then
            echo "FAIL: unexpected emacs version output: $EMACS_VERSION"
            exit 1
          fi
          echo "PASS: emacs snapshot is functional"
