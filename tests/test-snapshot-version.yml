name: Test setup-emacs snapshot version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 'snapshot'
      - name: Assert emacs is installed
        run: |
          echo "Checking emacs installation (snapshot)..."
          if ! command -v emacs &>/dev/null; then
            echo "FAIL: emacs command not found"
            exit 1
          fi
          echo "PASS: emacs (snapshot) is installed"
      - name: Assert emacs is executable and reports a version
        run: |
          ACTUAL_VERSION=$(emacs --version | head -1)
          echo "actual: $ACTUAL_VERSION"
          if [ -z "$ACTUAL_VERSION" ]; then
            echo "FAIL: emacs --version returned empty output"
            exit 1
          fi
          echo "PASS: emacs reports version: $ACTUAL_VERSION"
