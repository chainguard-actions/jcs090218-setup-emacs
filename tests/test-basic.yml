name: Test basic Emacs version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: '27.2'
      - name: Assert Emacs is installed
        run: |
          if ! command -v emacs &>/dev/null; then
            echo "FAIL: emacs command not found after installation"
            exit 1
          fi
          echo "Emacs version installed:"
          emacs --version
          echo "PASS"
