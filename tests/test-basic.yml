name: Test basic Emacs installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          version: "27.2"
      - name: Assert emacs is installed
        run: |
          echo "Checking emacs is on PATH..."
          if ! command -v emacs >/dev/null 2>&1; then
            echo "FAIL: emacs not found on PATH"
            exit 1
          fi
          echo "PASS: emacs found at $(command -v emacs)"
      - name: Assert emacs version matches
        run: |
          ACTUAL_VERSION="$(emacs --version | head -1)"
          echo "actual: $ACTUAL_VERSION"
          if ! echo "$ACTUAL_VERSION" | grep -q "27.2"; then
            echo "FAIL: expected version 27.2 but got: $ACTUAL_VERSION"
            exit 1
          fi
          echo "PASS: emacs version 27.2 confirmed"
